<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 520" width="470" height="520">
  <defs>
    <style>
      @keyframes termFade {
        0% { opacity: 0; transform: translateY(4px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .term-font { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 11.5px; }
      .header-bg { fill: #161b22; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #8b949e; }
      .line-0 { animation: termFade 0.25s ease-out 0.05s both; }
      .line-1 { animation: termFade 0.25s ease-out 0.12s both; }
      .line-2 { animation: termFade 0.25s ease-out 0.18s both; }
      .line-3 { animation: termFade 0.25s ease-out 0.24s both; }
      .line-4 { animation: termFade 0.25s ease-out 0.3s both; }
      .line-5 { animation: termFade 0.25s ease-out 0.36s both; }
      .line-6 { animation: termFade 0.25s ease-out 0.42s both; }
      .line-7 { animation: termFade 0.25s ease-out 0.48s both; }
      .line-8 { animation: termFade 0.25s ease-out 0.54s both; }
      .line-9 { animation: termFade 0.25s ease-out 0.6s both; }
      .line-10 { animation: termFade 0.25s ease-out 0.66s both; }
      .line-11 { animation: termFade 0.25s ease-out 0.72s both; }
      .line-12 { animation: termFade 0.25s ease-out 0.78s both; }
      .line-13 { animation: termFade 0.25s ease-out 0.84s both; }
      .line-14 { animation: termFade 0.25s ease-out 0.9s both; }
      .line-15 { animation: termFade 0.25s ease-out 0.96s both; }
      .swatches { animation: termFade 0.3s ease-out 1.05s both; }
    </style>
    <linearGradient id="infoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window Frame -->
  <rect x="1" y="1" width="468" height="518" rx="12" fill="url(#infoGrad)" stroke="#30363d" stroke-width="1.2"/>

  <!-- Title Bar -->
  <path d="M 1 13 A 12 12 0 0 1 13 1 L 457 1 A 12 12 0 0 1 469 13 L 469 36 L 1 36 Z" class="header-bg"/>
  <line x1="1" y1="36" x2="469" y2="36" stroke="#21262d" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="20" cy="18" r="5.5" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="5.5" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="5.5" fill="#27ca40"/>

  <!-- Window Title -->
  <text x="235" y="22" text-anchor="middle" class="title-text">lakshman@dev — neofetch</text>

