      <rect x="147" y="460.0" width="22" height="10" rx="2" fill="#eba0ac"/>
      <rect x="174" y="460.0" width="22" height="10" rx="2" fill="#94e2d5"/>
      <rect x="201" y="460.0" width="22" height="10" rx="2" fill="#f5c2e7"/>
      <rect x="228" y="460.0" width="22" height="10" rx="2" fill="#b4befe"/>
